<style>
:root{
  --bg:#E9EEF4; --surface:#FFFFFF; --ink:#0F1E30; --muted:#465568; --line:#D5DDE7; --soft:#F4F7FB;
  --accent:#0B5FA5; --accent-soft:#E1ECF7; --accent-ink:#FFFFFF; --amber:#A8701A;
  --good:#2C7A4B; --good-soft:#E3F2E9; --warn:#A8701A; --warn-soft:#F8EEDC; --bad:#B0372F; --bad-soft:#F8E4E2;
  --d:#C0392B; --i:#C9971A; --s:#2E8B57; --c:#2C6CB0;
  --f-display:"Montserrat","Segoe UI",Arial,sans-serif; --brand:#003158; --gold:#F2B705; --brand-ink:#FFFFFF;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.tv{background:radial-gradient(1200px 700px at 15% -10%,#0d4f86 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#0a3d68 0%,transparent 55%),#00213d;color:#fff;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--brand);color:#fff}
.top img{height:34px;width:auto;display:block}
.top .tt{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15}
.top .tt small{display:block;font-family:var(--f-body);font-weight:400;opacity:.75;font-size:12.5px}
.top .sp{flex:1}
.top a,.top button.lnk{color:#fff;opacity:.85;text-decoration:none;font-size:14px;background:none;border:0;padding:6px 8px;border-radius:8px}
.top a:hover,.top button.lnk:hover{opacity:1;background:rgba(255,255,255,.1)}
.top .who{font-size:13.5px;opacity:.75}@media (max-width:560px){.top .who{display:none}}
.top button.lnk{display:inline-flex;align-items:center;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(15,30,48,.04),0 8px 24px rgba(15,30,48,.05)}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-family:var(--f-display);font-size:14.5px;background:var(--accent);color:#fff;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:#1d1600}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;opacity:.9}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.big{padding:16px 26px;font-size:17px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.muted{color:var(--muted)}
.msg{min-height:20px;font-size:14px;margin-top:10px;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-weight:600;min-width:52px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.segc{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}.segc input{width:78px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-weight:600}
.list{display:grid;gap:10px;margin-top:10px}
.salaitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.salaitem b{font-family:var(--f-mono);font-size:15px;letter-spacing:.06em}
.salaitem .sp{flex:1;min-width:0}
.salaitem small{display:block;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.off{background:#eee;color:#666}
.hero{background:linear-gradient(120deg,var(--brand),#0b4f86);color:#fff;border-radius:18px;padding:26px 26px;margin-bottom:18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:28px}
.hero p{margin:6px 0 0;opacity:.85;max-width:560px}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:90}

.eqp{font-family:var(--f-display);font-weight:800;width:28px;padding-top:1px}.eqr .sw{width:14px;height:14px;border-radius:4px;margin-top:4px;flex:none}
.eqm{flex:1;min-width:0}.eqt{display:flex;justify-content:space-between;gap:8px}.eqt span{font-family:var(--f-mono);font-size:14px}
.eqbar{height:8px;border-radius:99px;background:#e3e8ee;margin:6px 0;overflow:hidden}.eqbar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.eqs2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.pbar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tblw{overflow-x:auto}
.atbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
.atbl th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.atbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.atbl .r{text-align:right}.atbl .c{text-align:center}
.atbl small{display:block;font-size:12px}
.stt{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}.stt i{width:9px;height:9px;border-radius:50%;background:#2fbf71}.stt.off i{background:#c2c8d0}.stt.off{color:var(--muted)}
.anm{display:inline-flex;align-items:center;gap:8px;font-weight:600}.anm .av{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:19px}
.asel{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:170px}
/* ===== ícones SVG animados ===== */
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none;overflow:visible}
.ic *{transform-box:fill-box;transform-origin:center}
.shp{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.ic.draw .d{stroke-dasharray:40;stroke-dashoffset:40;animation:icdraw .55s .1s ease forwards}
@keyframes icdraw{to{stroke-dashoffset:0}}
.ic.pulse{animation:icpulse 1.6s ease-in-out infinite}
@keyframes icpulse{50%{transform:scale(1.14)}}
.ic.flick .fl{transform-origin:50% 100%;animation:icflick .7s ease-in-out infinite alternate}
@keyframes icflick{0%{transform:scale(1,1) rotate(-4deg)}100%{transform:scale(1.06,1.14) rotate(4deg)}}
.ic.zap .bl{animation:iczap 1.4s ease-in-out infinite}
@keyframes iczap{0%,70%,100%{opacity:1}80%{opacity:.25}90%{opacity:1}}
.ic.tick .hand{transform-origin:50% 100%;animation:icspin 2s linear infinite}
@keyframes icspin{to{transform:rotate(360deg)}}
.ic.spin .rf{animation:icspin 1.6s linear infinite}
.ic.flip .hg{animation:icflip 2.2s ease-in-out infinite}
@keyframes icflip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(180deg)}}
.ic.bounce{animation:icbounce 1.4s ease-in-out infinite}
@keyframes icbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ic.nudge .ar{animation:icnudge 1.2s ease-in-out infinite}
@keyframes icnudge{50%{transform:translateX(3px)}}
.ic.wave .w1{animation:icwave 1.4s ease-in-out infinite}.ic.wave .w2{animation:icwave 1.4s .25s ease-in-out infinite}
@keyframes icwave{0%,100%{opacity:1}50%{opacity:.15}}
.ic.blink .pl1{animation:icwave 1.6s ease-in-out infinite}
.ic.shine .cr,.ic.shine .sp,.ic.shine .tr{animation:icshine 1.8s ease-in-out infinite}
@keyframes icshine{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-6deg)}}
.ic.grow .ex{animation:icgrow 1.6s ease-in-out infinite}
@keyframes icgrow{50%{transform:scale(1.1)}}
.ic.big{width:64px;height:64px}
.ic.xl{width:96px;height:96px}
.tvbtn,.btn{display:inline-flex;align-items:center;gap:7px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.pd,.fgrid,.awards{opacity:1}}
</style>

 Q_I.forEach(q=>{const o=shuf(q.opts.map((x,i)=>({t:x,ok:i===q.ans})));all.push({cat:q.dim,tipo:'Qual não é?',t:q.t,opts:o.map(x=>x.t),certa:o.findIndex(x=>x.ok),exp:q.exp||''})});

 const pool=all.filter(q=>cats.includes(q.cat));const by={};shuf(pool).forEach(q=>(by[q.cat]=by[q.cat]||[]).push(q));
 const out=[],keys=shuf(Object.keys(by));let k=0;
 while(out.length<n&&keys.some(c=>by[c].length)){const c=keys[k++%keys.length];if(by[c].length)out.push(by[c].pop())}

 try{const s=await rpc('din_estado',{p_codigo:P.code,p_id:P.me.id,p_token:P.me.token});
  if(s.saiu){try{localStorage.removeItem(P.key)}catch(e){}P.me=null;P_join('Você saiu da sala. Se foi engano, entre de novo.');return}
  P.st=s;P.me.nome=s.eu.nome;P.me.avatar=s.eu.avatar;P_render()}
 catch(e){if(/não encontrada/i.test(e.message||'')){$('#app').innerHTML=`<div class="pwrap">${P_head()}<div class="center"><h2>Sala não encontrada</h2><p>Confira o código com o organizador.</p></div></div>`;return}}

function P_render(){

 const view=f+'|'+(e.seq||0)+'|'+(e.idx??'')+'|'+(r?1:0)+'|'+(g?g.id+g.nome:'')+'|'+s.aberta+'|'+expd+'|'+(s.minha?s.minha.t:'');
 if(view===P.lastView){if(f==='pergunta'&&!r&&!expd)P_timer();return}
 const changed=view!==P.lastView;P.lastView=view;
 const ind=e.modo==='individual',qd=ind?(s.minha||{}):e,rot=ind?'Rodada':'Pergunta';
 const gp=g?`<span class="gpill" style="--gc:${g.cor}">${ic('users')} ${esc(g.nome)}</span>`:'';

 if(f==='lobby'){
  h=`<div class="center" style="--gc:${g?g.cor:'rgba(255,255,255,.2)'}"><div class="bigav">${esc(s.eu.avatar)}</div><h2>Você está dentro, ${esc(s.eu.nome.split(' ')[0])}!</h2>

 else if(f==='intro'){h=`<div class="center"><p>${rot} ${e.idx+1} de ${e.total}</p><h2 style="font-size:34px">Prepare-se!</h2><p>${ind?'Sua pergunta é só sua':esc(catNome(e.cat))}</p><div class="wait"><i></i><i></i><i></i></div>${gp}</div>`}

   <div class="popts${two?' two':''}" id="popts">${qd.opts.map((o,i)=>`<button class="popt c${i}" data-a="${i}"><span class="sh">${SHAPES[i]}</span>${esc(o)}</button>`).join('')}</div><div class="msg" id="pm" style="color:#ffb4ad;text-align:center"></div>`}}
 else if(f==='revelacao'){
  const ok=r&&r.correta,pl=e.placar||{},mypos=(pl.pos||{})[P.me.id],gq=g&&pl.eq?pl.eq.findIndex(x=>x.id===g.id)+1:0;
  const certa=qd.opts&&qd.certa!=null?qd.opts[qd.certa]:'';
  const stt=`<div class="stat"><div><b>${s.eu.pontos}</b>pontos</div><div><b>${s.eu.acertos}</b>acertos</div>${s.eu.sequencia>1?`<div><b>${ic('flame','flick')} ${s.eu.sequencia}</b>seguidas</div>`:''}${mypos?`<div><b>${ordinal(mypos)}</b>no ranking</div>`:''}</div>`;
  h=`<div class="center">${r?(ok?`<div class="res ok"><div class="rico">${ic('check','draw big')}</div><h2>Acertou!</h2><div class="plus">+${r.pontos}</div></div>`:`<div class="res bad"><div class="rico">${ic('x','draw big')}</div><h2>Não foi dessa vez</h2>${certa?`<p>Resposta certa: <b>${esc(certa)}</b></p>`:''}</div>`)
   :`<div class="res none"><div class="rico">${ic('clock','tick big')}</div><h2>Sem resposta</h2>${certa?`<p>Resposta certa: <b>${esc(certa)}</b></p>`:''}</div>`}

   ${gq?`<p style="font-size:15px">Sua equipe está em <b>${ordinal(gq)} lugar</b></p>`:''}<p style="font-size:14px;opacity:.65">Veja o ranking completo no telão.</p></div>`;
  if(changed){(ok?SFX.ok:SFX.bad)();try{navigator.vibrate&&navigator.vibrate(ok?[60]:[120,60,120])}catch(x){}}}
 else if(f==='apuracao'){h=`<div class="center"><div class="bigav">${ic('hourglass','flip big')}</div><h2>Apurando o resultado…</h2><p>Olhe para o telão!</p></div>`}
 else if(f==='fim'){
  const fi=e.final||{},pos=(fi.pos||{})[P.me.id],tot=fi.n||0,gpos=g&&fi.gpos?fi.gpos[g.id]:null;
  h=`<div class="center"><div class="bigav">${esc(s.eu.avatar)}</div><p>Você ficou em</p><div class="posbig">${pos?ordinal(pos):'-'}</div><p>de ${tot} participantes</p>

   ${g?`<p style="margin-top:10px">Seu grupo</p>${gp}${gpos?`<p>${gpos===1?ic('crown','shine')+' ':''}<b>${ordinal(gpos)} lugar</b> entre ${fi.ng} grupos</p>`:''}`:''}
   <p style="font-size:14px;opacity:.65;margin-top:10px">${s.aberta?'Obrigado por participar!':'Dinâmica encerrada. Obrigado por participar!'}</p></div>`;
  if(changed&&(pos&&pos<=3||gpos===1)){confetti();SFX.win()}}
 $('#app').innerHTML=`<div class="pwrap">${P_head()}${h}</div>`;P_bindHead();
 if(f==='pergunta'&&!r&&!expd&&qd.opts){$('#popts').onclick=P_answer;P_timer()}}
function P_timer(){clearInterval(P.timer);const e=P.st.estado;const tick=()=>{const b=$('#pbar');if(!b){clearInterval(P.timer);return}
  const left=(Date.parse(e.fim)-now())/1000,p=Math.max(0,Math.min(1,left/e.segundos));b.firstElementChild.style.width=p*100+'%';b.classList.toggle('low',left<5);
  if(left<=-.6){clearInterval(P.timer);if(!P.sending){P.lastView='';P_render()}}};tick();P.timer=setInterval(tick,200)}
async function P_answer(ev){const b=ev.target.closest('[data-a]');if(!b||P.sending)return;P.sending=true;const a=+b.dataset.a;
 $$('#popts .popt').forEach(x=>{x.disabled=true;if(x!==b)x.style.opacity=.3});try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}
 try{await rpc('din_responder',{p_codigo:P.code,p_id:P.me.id,p_token:P.me.token,p_resposta:a});P.st.resposta={resposta:a};P.lastView='';clearInterval(P.timer);P_render()}
 catch(err){const m=$('#pm');if(m)m.textContent=errMsg(err);$$('#popts .popt').forEach(x=>{x.disabled=false;x.style.opacity=''});if(/já respondeu|encerrada|tempo/i.test(err.message||''))P_poll(true)}
 finally{P.sending=false}}

async function O_fetch(){

 if(sx){O.sala.aberta=sx.aberta;if(((sx.estado||{}).seq||0)>(E().seq||0)){O.adopt=E().fase;O.sala.estado=sx.estado;O.sala.grupos=sx.grupos||[];O.boardSig=''}}

   if(O.mode==='tv'){O_stop();O.revealing=false;if(E().fase==='fim'&&prev!=='fim')O_final(true);else O_route()}else A_render(true)}
  else O_refresh()}catch(e){}

async function O_saveEstado(e){const o=E();e.seq=(o.seq||0)+1;['entrada','reload','auto'].forEach(k=>{if(e[k]===undefined&&o[k]!==undefined)e[k]=o[k]});

  return`<tr><td><span class="stt ${online(j)?'on':'off'}"><i></i>${online(j)?'Online':'Sem sinal'}</span><small class="muted">${A_ago(j)}</small></td><td><span class="anm"><span class="av">${esc(j.avatar)}</span>${esc(j.nome)}</span></td>
  <td><select data-grp="${j.id}" class="asel"><option value="">Sem grupo</option>${G.map(g=>`<option value="${g.id}"${j.grupo===g.id?' selected':''}>${esc(g.nome)}</option>`).join('')}</select></td>
  <td class="r mono">${j.pontos}</td><td class="r mono">${j.acertos}</td><td class="c">${st}</td><td class="r"><button class="btn ghost danger sm" data-rm="${j.id}">${A.sure['rm:'+j.id]?'Confirmar':'Remover'}</button></td></tr>`}).join('')
  :`<tr><td colspan="7" class="muted" style="text-align:center;padding:22px">${O.jog.length?'Ninguém neste filtro.':'Ninguém entrou ainda.'}</td></tr>`}
function A_confirm(key,btn,label){if(A.sure[key]&&Date.now()-A.sure[key]<4000){delete A.sure[key];return true}A.sure[key]=Date.now();if(btn){btn.dataset.lbl=btn.dataset.lbl||btn.textContent;btn.textContent=label||'Clique de novo para confirmar';setTimeout(()=>{if(btn.isConnected&&btn.dataset.lbl){btn.textContent=btn.dataset.lbl;delete btn.dataset.lbl}delete A.sure[key];A.tabSig=''},4000)}return false}
async function A_fresh(){const {data}=await SB.from('salas').select('*').eq('id',O.sala.id).single();if(data){const reg=O.sala.registrado;O.sala=data;O.sala.registrado=reg}}
async function A_click(ev){const rm=ev.target.closest('[data-rm]');
 if(rm){const id=rm.dataset.rm,j=O.jog.find(x=>x.id===id);if(!A_confirm('rm:'+id,rm,'Confirmar'))return;pend(id,null,true);
  const {error}=await SB.from('sala_jogadores').delete().eq('id',id);if(error)return toast(errMsg(error),'err');O.jog=O.jog.filter(x=>x.id!==id);toast((j?j.nome:'Participante')+' removido.');A.tabSig='';return A_render()}
 const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act;
 const needSure={rm_all:'Remover todos? Clique de novo',rm_off:'Remover offline? Clique de novo',restart:'Zerar tudo? Clique de novo',close:'Encerrar? Clique de novo',redo:'Repetir? Clique de novo'};
 if(needSure[act]&&!A_confirm(act,b,needSure[act]))return;
 b.disabled=true;
 try{await A_fresh();const e=E(),idx=e.idx??-1,last=idx+1>=RQ();
  if(act==='rm_all'){const {error}=await SB.from('sala_jogadores').delete().eq('sala',O.sala.id);if(error)throw error;O.jog.forEach(j=>pend(j.id,null,true));O.jog=[];toast('Todos foram removidos da sala.')}
  else if(act==='rm_off'){const ids=O.jog.filter(j=>!online(j)).map(j=>j.id);if(!ids.length)toast('Ninguém offline.');else{const {error}=await SB.from('sala_jogadores').delete().in('id',ids);if(error)throw error;ids.forEach(i=>pend(i,null,true));O.jog=O.jog.filter(j=>!ids.includes(j.id));toast(ids.length+' pessoa(s) removida(s).')}}
  else if(act==='start'){if(!O.jog.length){toast('Ainda não entrou ninguém.');return}const G=O.sala.grupos||[];if(G.length&&O.jog.some(j=>!G.some(g=>g.id===j.grupo)))await O_autoGroups();await core_openQ(0);toast('Dinâmica iniciada.')}
  else if(act==='open_now'){await core_openQ(Math.max(0,idx))}
  else if(act==='reveal'){if(e.fase==='pergunta'){await O_fetch();await core_reveal();toast('Resposta revelada.')}}
  else if(act==='next'){if(e.fase==='pergunta')await core_reveal();if(last){await core_final(0);toast('Resultado no telão.')}else{await core_openQ(idx+1);toast((MODO()==='individual'?'Rodada ':'Pergunta ')+(idx+2)+' aberta.')}}
  else if(act==='plus'){const r=await rpc('din_admin',{p_sala:O.sala.id,p_acao:'mais_tempo',p_seg:15});O.sala.estado=r.estado;toast('+15 segundos.')}
  else if(act==='final'){await core_final(0);toast('Resultado atualizado.')}
  else if(act==='auto'){await O_saveEstado(Object.assign({},e,{auto:e.auto?0:8}));toast(E().auto?'O telão vai avançar sozinho 8s depois de mostrar a resposta.':'Avanço manual.')}
  else if(act==='sync'){await O_saveEstado(Object.assign({},e));toast('Telão atualizado.')}
  else if(act==='reload'){await O_saveEstado(Object.assign({},e,{reload:new Date().toISOString()}));toast('Os celulares vão recarregar em instantes.')}
  else if(act==='recalc'){await rpc('din_admin',{p_sala:O.sala.id,p_acao:'recalcular'});toast('Pontuação recalculada.')}
  else if(act==='redo'){await rpc('din_admin',{p_sala:O.sala.id,p_acao:'limpar_pergunta',p_idx:idx});await core_openQ(idx);toast('Pergunta reaberta com o tempo cheio.')}
  else if(act==='entrada'){await O_saveEstado(Object.assign({},e,{entrada:e.entrada==='livre'?'':'livre'}));toast(E().entrada==='livre'?'Entrada liberada pelo QR code.':'Entrada fechada.')}
  else if(act==='restart'){await rpc('din_admin',{p_sala:O.sala.id,p_acao:'zerar'});await O_saveEstado({fase:'lobby',total:RQ()});O.sala.registrado=false;toast('Tudo zerado. Sala de espera aberta.')}
  else if(act==='close'){await SB.from('salas').update({aberta:false}).eq('id',O.sala.id);O.sala.aberta=false;toast('Sala encerrada.')}
  else if(act==='reopen'){await SB.from('salas').update({aberta:true}).eq('id',O.sala.id);O.sala.aberta=true;toast('Sala reaberta.')}
  await O_fetch();A_render(true)}
 catch(err){toast(errMsg(err),'err')}finally{if(b.isConnected)b.disabled=false}}
</script>
</body>
